services:
  hummingbird:
    image: kibble.apps.blindhub.ca/cobdfamily/hummingbird:latest
    # The fleet's release workflows publish single-arch (amd64)
    # images on purpose — production hosts are all amd64 and
    # multi-arch builds noticeably slow CI. Pinning the platform
    # here lets apple-silicon dev hosts run the stack via Docker
    # Desktop's Rosetta translation layer.
    platform: linux/amd64
    container_name: openapi-kados-hummingbird
    ports:
      # Bind to localhost only — KADOS reaches hummingbird via the
      # internal docker network (`http://hummingbird:8000`); the
      # host port is just so the test harness on the host can hit
      # hummingbird directly to assert version + adapter wire
      # contract without going through the SOAP layer.
      - "127.0.0.1:${HUMMINGBIRD_HTTP_PORT:-8001}:8000"
    environment:
      # Default-backend credentials (used when no plugin is loaded).
      # The KADOS test harness signs in as testuser/testpass; matching
      # them here means the stack is end-to-end usable out of the box.
      HUMMINGBIRD_USERNAME: "${HUMMINGBIRD_USERNAME:-testuser}"
      HUMMINGBIRD_PASSWORD: "${HUMMINGBIRD_PASSWORD:-testpass}"
      # No plugin in this default stack — pure file-backed standalone.
      HUMMINGBIRD_PLUGIN: ""
      # Optional: gate the kados RPC surface with X-API-Key. When set
      # here, also set OPENAPI_API_KEY on the kados service below so
      # the adapter forwards the same key.
      KADOS_API_KEY: "${KADOS_API_KEY:-}"
    healthcheck:
      # python is on PATH (slim base image); avoids depending on
      # curl/wget being installed in the runtime layer.
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/', timeout=2).status==200 else 1)"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  kados:
    image: kolibreorg/kados:v2-latest
    container_name: openapi-kados
    depends_on:
      hummingbird:
        condition: service_healthy
    ports:
      - "${KADOS_HTTP_PORT:-8080}:80"
    environment:
      # Default points at the in-stack hummingbird; override to test
      # against an external OpenAPI backend (eg. the mock_backend.py
      # script for fully offline runs).
      OPENAPI_BASE_URL: "${OPENAPI_BASE_URL:-http://hummingbird:8000}"

      # Optional: app-level credential, sent as X-API-Key on every
      # outbound request. Pair with KADOS_API_KEY on hummingbird.
      OPENAPI_API_KEY: "${OPENAPI_API_KEY:-}"

      # KADOS logging verbosity. One of DEBUG, INFO, WARNING,
      # ERROR, FATAL.
      KADOS_LOG_LEVEL: "${KADOS_LOG_LEVEL:-INFO}"

      # Select the adapter by name; this overrides whatever the
      # image ships in its default service.ini.
      KADOS_ADAPTER_NAME: "OpenAPIAdapter"
    volumes:
      # Drop the adapter class into the image's adapter directory
      # so DaisyOnlineService::setupAdapter() can load it.
      - ./services/kados/includes/adapters/OpenAPIAdapter.class.php:/var/www/include/adapter/OpenAPIAdapter.class.php:ro

      # Override the image's service.ini with an OpenAPI-flavored
      # one. Belt-and-braces with KADOS_ADAPTER_NAME above.
      - ./services/kados/config/service.openapi.ini:/var/www/service.ini:ro
    restart: unless-stopped
