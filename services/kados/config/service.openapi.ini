[Service]

; The identifier of the Service Provider.
serviceProvider = OpenAPI

; The identity of the Service.
service = OpenAPI

; Specifies whether getQuestions with the reserved parameter 'search'
; is supported.
supportsSearch = 1

; Specifies content access methods supported by the Service.
accessConfig = STREAM_AND_DOWNLOAD

; Optional operations exposed on the SOAP layer.
supportedOptionalOperations[] = SERVICE_ANNOUNCEMENTS
supportedOptionalOperations[] = SET_BOOKMARKS
supportedOptionalOperations[] = GET_BOOKMARKS
supportedOptionalOperations[] = DYNAMIC_MENUS

supportedOptionalOperationsExtra[] = PROGRESS_STATE
supportedOptionalOperationsExtra[] = TERMS_OF_SERVICE
supportedOptionalOperationsExtra[] = ADD_CONTENT

announcementsPullFrequency = 0

[Adapter]
; Name of the adapter class. Resolves to
; include/adapter/OpenAPIAdapter.class.php inside the container.
name = OpenAPIAdapter

; No constructor args needed; OpenAPIAdapter reads
; OPENAPI_BASE_URL and OPENAPI_API_KEY from the environment.